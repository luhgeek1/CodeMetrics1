name: codemetrics1

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      SITE_URL: https://localhost:${HTTPS_PORT:-8443}
      DATABASE_URL: postgresql://postgres:secret@db:5432/hackathon
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: hackathon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
